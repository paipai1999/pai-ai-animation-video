version: '3.8'

services:
  # 1. Redis Message Broker
  redis:
    image: redis:7-alpine
    container_name: animaker_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # 2. FastAPI Backend Server
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: animaker_backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite+aiosqlite:///storage/app.db
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_DOMAIN=${R2_PUBLIC_DOMAIN}
    volumes:
      - ./storage:/app/storage
    depends_on:
      - redis
    restart: unless-stopped

  # 3. Celery Background Worker (Handles Video Downloading, AI generation & FFmpeg compositing)
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: animaker_worker
    command: celery -A backend.app.core.celery_app.celery_app worker --loglevel=info --concurrency=2
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite+aiosqlite:///storage/app.db
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_DOMAIN=${R2_PUBLIC_DOMAIN}
    volumes:
      - ./storage:/app/storage
    depends_on:
      - redis
      - backend
    restart: unless-stopped

volumes:
  redis_data:
